[project]
name = "retail"
version = "0.1.0"
description = "Analyse operationnelle retail (Instacart) - SQL DuckDB, segmentation, cross-selling, Power BI"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
